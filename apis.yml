- aid: automatic-data-processing:embedded-payroll
  name: ADP Embedded Payroll (RUN)
  description: ADP Embedded Payroll lets a software platform embed complete RUN Powered by ADP payroll
    screens — "Journeys" for People, Payroll, Reports, Taxes, Onboarding and Settings — inside its own
    product via a client-side JavaScript SDK and an iframe, alongside REST APIs for mutual-client linking
    and SSO. It is the only ADP developer library still actively maintained, and it has its own documentation
    site with a published llms.txt.
