- aid: automatic-data-processing:client-data-api
  name: ADP Client Data and Validation Tables API
  description: 'The ADP Client Data API exposes the configuration layer every other ADP integration depends
    on: validation tables (the client-specific reference data a write must match), Workforce Now custom
    code lists, and applicant onboarding. A caller that does not read these first will fail validation
    on writes it believed were well formed, because the permitted values are per-client rather than global.'
