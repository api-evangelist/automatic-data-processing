description: ADP gates API access via its Marketplace (https://apps.adp.com/) and partner program rather than self-serve
  pricing tiers. There are no public per-call rates. Integration partners enter a contract; mutual customers grant
  consent through ADP's authorization service. Pricing is bundled into the ADP product subscription (Workforce Now,
  RUN, Vantage, etc.) and not separately metered to the partner.
