notes: 'Re-checked 2026-09-14. ADP publishes NO pricing for API access, at any tier, anywhere on www.adp.com, developers.adp.com
  or apps.adp.com. Access is gated behind a developer agreement: an organization contracts with ADP (as an ADP Marketplace
  partner, an Integration partner, or an API Central client) and the API entitlement is bundled into the ADP product
  subscription the mutual client already pays for — Workforce Now, RUN, Vantage HCM, Enterprise HCM, iHCM or GlobalView.
  Partners are not metered per call. ADP''s own guidance on the Workforce Now API catalogue page is to ''contact your
  ADP representative regarding availability and pricing''. plan_count is 0 because there is no published plan to record,
  not because none was looked for.'
